services:

  # ============================================================
  # MQTT
  # ============================================================
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: urbanheat-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro


  # ============================================================
  # KAFKA
  # ============================================================
  kafka:
    image: apache/kafka:3.9.1
    container_name: urbanheat-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

      KAFKA_NUM_PARTITIONS: 6
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10


  # ============================================================
  # CREACIÓN DE TOPICS
  # ============================================================
  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy

    entrypoint: ["/bin/bash", "-c"]

    command: >
      "/opt/kafka/bin/kafka-topics.sh
      --bootstrap-server kafka:9092
      --create
      --if-not-exists
      --topic iot.raw.measurements
      --partitions 6
      --replication-factor 1 &&
      
      /opt/kafka/bin/kafka-topics.sh
      --bootstrap-server kafka:9092
      --create
      --if-not-exists
      --topic iot.invalid.measurements
      --partitions 3
      --replication-factor 1 &&
      
      /opt/kafka/bin/kafka-topics.sh
      --bootstrap-server kafka:9092
      --create
      --if-not-exists
      --topic iot.heat.alerts
      --partitions 3
      --replication-factor 1"


  # ============================================================
  # KAFKA UI
  # ============================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: urbanheat-kafka-ui

    depends_on:
      kafka-init:
        condition: service_completed_successfully

    ports:
      - "8080:8080"

    environment:
      KAFKA_CLUSTERS_0_NAME: urbanheat
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092


  # ============================================================
  # POSTGRESQL (Modificado: Se añade el bloque healthcheck)
  # ============================================================
  postgres:
    image: postgres:16
    container_name: urbanheat-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: urbanheat
      POSTGRES_USER: urbanheat
      POSTGRES_PASSWORD: urbanheat
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urbanheat -d urbanheat"]
      interval: 5s
      timeout: 5s
      retries: 5


  # ============================================================
  # MINIO
  # ============================================================
  minio:
    image: quay.io/minio/minio:latest
    container_name: urbanheat-minio

    command:
      - server
      - /data
      - --console-address
      - ":9001"

    ports:
      - "9000:9000"
      - "9001:9001"

    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

    volumes:
      - minio_data:/data


  # ============================================================
  # CREACIÓN DEL BUCKET MINIO
  # ============================================================
  minio-init:
    image: quay.io/minio/mc:latest

    depends_on:
      - minio

    entrypoint: ["/bin/sh", "-c"]

    command: >
      "until mc alias set local http://minio:9000 minioadmin minioadmin;
      do sleep 2;
      done;
      mc mb --ignore-existing local/urbanheat;
      exit 0"


  # ============================================================
  # MQTT → KAFKA
  # ============================================================
  mqtt-kafka-bridge:
    build: ./mqtt-kafka-bridge
    container_name: urbanheat-mqtt-kafka

    depends_on:
      kafka-init:
        condition: service_completed_successfully

      mosquitto:
        condition: service_started

    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883

      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: iot.raw.measurements


  # ============================================================
  # SIMULADOR IoT (Modificado: Espera a que postgres esté "healthy")
  # ============================================================
  iot-simulator:
    build: ./iot-simulator
    container_name: urbanheat-simulator
    depends_on:
      mosquitto:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883

      CITY_ID: ${CITY_ID:-logrono}
      SENSOR_COUNT: ${SENSOR_COUNT:-100}
      INTERVAL_SECONDS: ${INTERVAL_SECONDS:-1}

    restart: unless-stopped


  # ============================================================
  # SPARK (Modificado: Espera a que postgres esté "healthy")
  # ============================================================
  spark:
    build: ./spark
    container_name: urbanheat-spark

    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      POSTGRES_JDBC: jdbc:postgresql://postgres:5432/urbanheat
      POSTGRES_USER: urbanheat
      POSTGRES_PASSWORD: urbanheat

      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: urbanheat

      SPARK_LOCAL_IP: urbanheat-spark
      SPARK_DRIVER_HOST: urbanheat-spark
      SPARK_DRIVER_BIND_ADDRESS: 0.0.0.0

    restart: unless-stopped


  # ============================================================
  # GRAFANA
  # ============================================================
  grafana:
    image: grafana/grafana:11.2.0
    container_name: urbanheat-grafana

    depends_on:
      - postgres

    ports:
      - "3000:3000"

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin

    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro


# ================================================================
# VOLUMES
# ================================================================
volumes:
  postgres_data:
  minio_data:
  grafana_data:
